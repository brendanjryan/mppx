packages:
  - .
  - examples/*
  - examples/session/*
  - src/*/server/internal/html

strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade

onlyBuiltDependencies:
  - bufferutil
  - bun
  - cpu-features
  - esbuild
  - protobufjs
  - ssh2
  - utf-8-validate

overrides:
  mppx: 'workspace:*'
  vitest: 'npm:@voidzero-dev/vite-plus-test@~0.1.24'
  typescript: '~5.9.3'
  ox: '0.14.7'
  viem: '^2.47.5'
  path-to-regexp@<8.4.0: '8.4.0'
  tar@>=7.0.0 <=7.5.20: '7.5.21'
  '@modelcontextprotocol/sdk@>=1.10.0 <=1.25.3': '1.26.0'
  qs@>=6.11.1 <=6.15.1: '6.15.2'
  hono@>=4.0.0 <4.12.34: '4.12.34'
  minimatch@>=5.0.0 <5.1.8: '5.1.8'
  minimatch@>=9.0.0 <9.0.7: '9.0.7'
  rollup@>=4.0.0 <4.59.0: '4.59.0'
  ajv@>=7.0.0-alpha.0 <8.18.0: '8.18.0'
  '@hono/node-server@>=1.0.0 <1.19.15': '1.19.17'
  elysia@<1.4.26: '1.4.26'
  file-type: '21.3.2'
  flatted@<=3.4.1: '>=3.4.2'
  follow-redirects@<=1.15.11: '1.16.0'
  undici@>=7.0.0 <7.29.0: '7.29.0'
  socket.io-parser@>=4.0.0 <4.2.7: '4.2.7'
  yaml@<2.8.3: '>=2.8.3'
  brace-expansion@>=5.0.0 <5.0.9: '5.0.9'
  lodash@<=4.17.23: '>=4.18.0'
  protobufjs@>=7.0.0 <7.6.5: '7.6.5'
  '@protobufjs/utf8@<=1.1.0': '1.1.1'
  '@grpc/grpc-js@>=1.14.0 <1.14.4': '1.14.4'
  body-parser@>=2.0.0 <2.3.0: '2.3.0'
  fast-uri@>=3.0.0 <3.1.5: '3.1.5'
  ip-address@>=10.0.0 <=10.3.0: '10.3.1'
  js-yaml@>=3.0.0 <3.15.1: '3.15.1'
  js-yaml@>=4.0.0 <4.3.1: '4.3.1'
  nanoid@>=3.0.0 <3.3.18: '3.3.18'
  postcss@>=8.0.0 <8.5.23: '8.5.23'
  tmp@>=0.2.0 <0.2.7: '0.2.7'
  vite@>=8.0.0 <=8.0.15: '8.0.16'
  ws@>=8.0.0 <8.21.0: '8.21.0'
  'dockerode>uuid': '11.1.1'
  '@metamask/sdk>uuid': '11.1.1'
  '@metamask/sdk-communication-layer>uuid': '11.1.1'
  '@metamask/utils>uuid': '11.1.1'

nodeOptions: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

# This shared runtime starts blank. Add repository-specific steps or setup when needed.
environment:
  name: agent-runtime
  image:
    kind: preset
    name: node24
  steps:
    - RUN corepack enable
  setup:
    - name: install-dependencies
      commands:
        - pnpm install --frozen-lockfile
      cache:
        files:
          - pnpm-lock.yaml
    - name: generate-html
      commands:
        - pnpm exec tsx scripts/build:html.ts
  setupCache:
    ttl: 24h
